<div class="summary-cards">
  <div class="sum-card sum-done">
    <div class="sum-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </div>
    <div class="sum-text">
      <div class="sum-title">Completado</div>
      <div class="sum-num" id="cntDone" data-target="0">0</div>
      <div class="sum-lbl">Citas completadas</div>
    </div>
  </div>

  <div class="sum-card sum-wait">
    <div class="sum-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>
    <div class="sum-text">
      <div class="sum-title">En espera</div>
      <div class="sum-num" id="cntWait" data-target="0">0</div>
      <div class="sum-lbl">Citas programadas</div>
    </div>
  </div>

  <div class="sum-card sum-cancel">
    <div class="sum-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    </div>
    <div class="sum-text">
      <div class="sum-title">Cancelado</div>
      <div class="sum-num" id="cntCancel" data-target="0">0</div>
      <div class="sum-lbl">Citas canceladas</div>
    </div>
  </div>

  <div class="sum-card sum-soon">
    <div class="sum-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </div>
    <div class="sum-text">
      <div class="sum-title">Próximos</div>
      <div class="sum-num" id="cntSoon" data-target="0">0</div>
      <div class="sum-lbl">Próximos pacientes</div>
    </div>
  </div>
</div>
