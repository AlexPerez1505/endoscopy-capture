<div class="filter-card">
  <h4>Filtros rápidos</h4>
  <label class="filter-item fi-done">
    <input type="checkbox" checked>
    <span class="filter-dot done"></span>
    Completado
  </label>
  <label class="filter-item fi-wait">
    <input type="checkbox" checked>
    <span class="filter-dot wait"></span>
    En espera
  </label>
  <label class="filter-item fi-cancel">
    <input type="checkbox" checked>
    <span class="filter-dot cancel"></span>
    Cancelado
  </label>
  <label class="filter-item fi-soon">
    <input type="checkbox" checked>
    <span class="filter-dot soon"></span>
    Próximamente
  </label>
</div>

<div class="proximas-card" id="proximasCard">
  <h4>Próximas citas</h4>
  <div id="proximasList"></div>
</div>
