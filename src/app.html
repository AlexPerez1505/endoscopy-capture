<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ENCLAII — Endoscopy Capture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/app.css" />
    <link rel="stylesheet" href="./styles/dashboard.css" />
    <link rel="stylesheet" href="./styles/pacientes.css" />
    <link rel="stylesheet" href="./styles/agenda_css/index.css" />
    <link rel="stylesheet" href="./styles/agenda_css/agendar.css" />
    <link rel="stylesheet" href="./styles/reports.css" />
    <link rel="stylesheet" href="./styles/report-editor.css" />
    <link rel="stylesheet" href="./styles/galeria.css" />
    <link rel="stylesheet" href="./styles/mensajes.css" />
    <link rel="stylesheet" href="./styles/qr.css" />
    <link rel="stylesheet" href="./styles/configuracion.css" />
    <script>
      document.documentElement.dataset.theme = localStorage.getItem('enclaii-theme') || 'dark';
    </script>
  </head>
  <body>
    <div class="dash">

      <!-- ============ SIDEBAR ============ -->
      <aside class="side">
        <div class="side-top">
          <button class="side-collapse-btn" id="sidebarCollapseBtn" type="button" aria-label="Contraer barra lateral" aria-expanded="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="side-brand-row">
            <div class="side-brand">
              <img src="./assets/logo.png" alt="ENCLAII" onerror="this.style.display='none'">
              <div class="side-brand-copy">
                <div class="side-brand-name">ENCL<span>AII</span></div>
                <div class="side-brand-tag">Endoscopy Capture</div>
              </div>
            </div>
          </div>
        </div>

        <a class="nav-item" data-nav="dashboard" href="#dashboard" title="Dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span class="nav-label">Dashboard</span>
        </a>
        <a class="nav-item" data-nav="agenda" href="#agenda" title="Agenda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span class="nav-label">Agenda</span>
        </a>
        <a class="nav-item" data-nav="pacientes" href="#pacientes" title="Pacientes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="nav-label">Pacientes</span>
        </a>
        <a class="nav-item" data-nav="qr" href="#qr" title="QR">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><path d="M15 15h2v2h-2z"/><path d="M19 15h2v6h-6v-2"/><path d="M12 7v4"/><path d="M7 12h4"/></svg>
          <span class="nav-label">QR</span>
        </a>
        <a class="nav-item" data-nav="ia-reportes" href="#ia-reportes" title="Reportes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="M12.5 12.5 14 11l1.5 1.5"/><path d="M14 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>
          <span class="nav-label">Reportes</span>
        </a>
        <!--
        <a class="nav-item" data-nav="mensajes" href="#mensajes" title="Mensajes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="nav-label">Mensajes</span>
        </a>
        -->
        <a class="nav-item" data-nav="galeria" href="#galeria" title="Galería">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <span class="nav-label">Galería</span>
        </a>
        <a class="nav-item" data-nav="configuracion" href="#configuracion" title="Configuración">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="nav-label">Configuración</span>
        </a>

      </aside>

      <!-- ============ MAIN ============ -->
      <main class="main">
        <header class="head rise d1">
          <div>
            <h1 id="headTitle">Dashboard</h1>
            <p class="sub" id="headSub">Resumen general de tu actividad clínica</p>
          </div>
          <div class="head-right">
            <button class="btn-ai" id="openAiAssistantBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 1 7 7c0 2.4-1.2 4.5-3 5.7V17a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-2.3C6.2 13.5 5 11.4 5 9a7 7 0 0 1 7-7z"/></svg>
              <span>Asistente IA</span>
            </button>
            <button class="bell" type="button" aria-label="Notificaciones">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </button>
            <button class="bell" id="themeToggle" type="button" aria-label="Cambiar tema">
              <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <div class="profile" id="profileMenu" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
              <span class="avatar">DR</span>
              <div>
                <strong>Doctor</strong>
                <span>Médico</span>
              </div>
              <div class="profile-dropdown" id="profileDropdown">
                <button type="button" id="logoutBtn" class="profile-dropdown-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                  Cerrar sesión
                </button>
              </div>
            </div>
          </div>
        </header>

        <div id="pageContent"><!-- Las páginas se inyectan aquí --></div>
      </main>
    </div>

    <script type="module" src="./js/router.js"></script>
  </body>
</html>
