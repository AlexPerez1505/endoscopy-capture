<link rel="stylesheet" href="./styles/agenda_css/agendar/_base.css">
<link rel="stylesheet" href="./styles/agenda_css/agendar/index.css">
<link rel="stylesheet" href="./styles/agenda_css/agendar/_tarjetas.css">
<link rel="stylesheet" href="./styles/agenda_css/agendar/_mes.css">
<link rel="stylesheet" href="./styles/agenda_css/agendar/_semana.css">
<link rel="stylesheet" href="./styles/agenda_css/agendar/_dia.css">
<link rel="stylesheet" href="./styles/agenda_css/agendar/_popup.css">
<link rel="stylesheet" href="./styles/agenda_css/agendar/_bloqueos.css">
<link rel="stylesheet" href="./styles/agenda_css/agendar/_sidebar.css">
<link rel="stylesheet" href="./styles/agenda_css/agendar/_events.css">

<div class="agenda-header rise d2">
  <div class="agenda-header-left">
    <h2>Agenda</h2>
    <p>Gestiona tus citas y procedimientos</p>
  </div>
  <a href="#agendar" class="btn-primary" data-nav="agendar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Agendar cita
  </a>
</div>

<div class="agenda-body rise d3">

  <div class="agenda-left">

    <!-- Toolbar: pestañas de vista + navegación mes -->
    <div class="cal-toolbar">
      <div class="view-tabs">
        <button class="view-tab">Día</button>
        <button class="view-tab">Semana</button>
        <button class="view-tab active">Mes</button>
      </div>
      <div class="toolbar-right">
        <div class="month-nav">
          <button aria-label="Mes anterior">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="month-label">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <div class="picker-wrap">
              <span id="mesActual">Mayo</span>
              <div class="picker-dropdown" id="mesPicker"><div class="picker-title">Mes</div></div>
            </div>
            <div class="picker-wrap">
              <span class="year" id="anioActual">2024</span>
              <div class="picker-dropdown" id="anioPicker"><div class="picker-title">Año</div></div>
            </div>
          </div>
          <button aria-label="Mes siguiente">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <button class="toolbar-filter-btn" id="toolbarFilterBtn" title="Mostrar filtros" aria-label="Filtros">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
          </svg>
        </button>
        <!-- Dropdown de filtros (solo visible cuando está expandido) -->
        <div class="filter-dropdown" id="toolbarFilterDropdown">
          <h4>Filtrar citas</h4>
          <div class="filter-list">
            <label class="filter-row" data-filter="ev-done">
              <input type="checkbox" checked>
              <span class="filter-indicator done"></span>
              <span class="filter-text">Completado</span>
            </label>
            <label class="filter-row" data-filter="ev-wait">
              <input type="checkbox" checked>
              <span class="filter-indicator wait"></span>
              <span class="filter-text">En espera</span>
            </label>
            <label class="filter-row" data-filter="ev-cancel">
              <input type="checkbox" checked>
              <span class="filter-indicator cancel"></span>
              <span class="filter-text">Cancelado</span>
            </label>
            <label class="filter-row" data-filter="ev-soon">
              <input type="checkbox" checked>
              <span class="filter-indicator soon"></span>
              <span class="filter-text">Próximo</span>
            </label>
          </div>
        </div>
        <button class="agenda-expand-btn" id="agendaExpandBtn" title="Expandir/Colapsar sidebar" aria-label="Expandir">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- partial: _tarjetas -->
    <div data-partial="_tarjetas"></div>

    <!-- partial: _mes -->
    <div data-partial="_mes"></div>

    <!-- partial: _semana -->
    <div data-partial="_semana"></div>

    <!-- partial: _dia -->
    <div data-partial="_dia"></div>

  </div>

  <!-- Panel derecho: filtros + próximas citas -->
  <div class="agenda-right">
    <div data-partial="_sidebar"></div>
  </div>

</div>

<!-- partial: _bloqueos -->
<div data-partial="_bloqueos"></div>

<!-- partial: _popup -->
<div data-partial="_popup"></div>

<!-- partial: _events (datos compartidos) -->
<div data-partial="_events"></div>

<script type="module">
  // Cargar HTML de partials antes de ejecutar el JS principal
  async function loadPartials() {
    const partials = document.querySelectorAll('[data-partial]');
    for (const el of partials) {
      const name = el.dataset.partial;
      try {
        const res = await fetch(`./pages/agenda_html/agendar/_${name}.blade.html`);
        if (!res.ok) continue;
        const html = await res.text();
        const wrapper = document.createElement('div');
        wrapper.innerHTML = html;
        el.replaceWith(...wrapper.childNodes);
      } catch (err) {
        console.error('Error cargando partial', name, err);
      }
    }
  }
  await loadPartials();

  // Importar los módulos JS de cada partial (registran funciones globales)
  await import('./js/agenda/agendar/_events.js');
  await import('./js/agenda/agendar/_mes.js');
  await import('./js/agenda/agendar/_semana.js');
  await import('./js/agenda/agendar/_dia.js');
  await import('./js/agenda/agendar/_popup.js');
  await import('./js/agenda/agendar/_bloqueos.js');
  await import('./js/agenda/agendar/_sidebar.js');
  await import('./js/agenda/agendar/_tarjetas.js');
</script>
<script src="./js/agenda/agendar/index.js" type="module"></script>
