
<style>
.patient-form-page{font-family:"Hanken Grotesk",sans-serif;color:var(--txt);padding-bottom:30px}
.patient-form-shell{max-width:1180px;margin:0 auto}
.patient-form-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}
.patient-form-head h2{margin:0;font-family:"Sora",sans-serif;font-size:20px;color:var(--txt)}
.patient-form-head p{margin:5px 0 0;color:var(--txt-soft);font-size:12.5px}
.patient-back{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid var(--stroke);border-radius:9px;background:var(--card);color:var(--txt);font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.patient-form-card{background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:22px;box-shadow:0 4px 12px rgba(0,0,0,.02)}
.patient-form-layout{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px}
.patient-photo-box{display:flex;flex-direction:column;align-items:center;gap:12px}
.patient-photo-preview{width:130px;height:155px;border-radius:18px;border:1px dashed var(--stroke-strong);background:var(--panel-2);display:grid;place-items:center;overflow:hidden;color:var(--txt-soft)}
.patient-photo-preview img{width:100%;height:100%;object-fit:cover}
.patient-photo-actions{display:flex;flex-direction:column;width:100%;gap:8px}
.patient-photo-btn{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--stroke);background:transparent;color:var(--txt);font:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
.patient-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.patient-field{display:flex;flex-direction:column;gap:6px}
.patient-field.full{grid-column:1/-1}
.patient-field.span-2{grid-column:span 2}
.patient-field label{color:var(--txt-soft);font-size:11px;font-weight:700}
.patient-field input,.patient-field select,.patient-field textarea{width:100%;min-height:42px;padding:10px 12px;border:1px solid var(--stroke);border-radius:9px;background:var(--panel-2);color:var(--txt);font:inherit;font-size:12.5px;outline:none}
.patient-field textarea{min-height:90px;resize:vertical}
.patient-field input:focus,.patient-field select:focus,.patient-field textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,199,244,.12)}
.patient-field input[readonly]{opacity:.8;cursor:not-allowed}
.patient-section{grid-column:1/-1;margin-top:8px;padding-top:17px;border-top:1px solid var(--stroke)}
.patient-section h3{margin:0 0 13px;font-family:"Sora",sans-serif;font-size:14px;color:var(--txt)}
.patient-files{padding:12px;border:1px dashed var(--stroke);border-radius:10px;background:var(--panel-2)}
.patient-existing-files{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.patient-existing-file{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid var(--stroke);border-radius:9px}
.patient-form-error{display:none;margin-bottom:14px;padding:11px 13px;border:1px solid rgba(255,90,110,.3);border-radius:10px;background:rgba(255,90,110,.08);color:#ff7888;font-size:12px}
.patient-form-error.show{display:block}
.patient-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.patient-action{min-width:130px;padding:11px 18px;border-radius:10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.patient-action.cancel{border:1px solid var(--stroke);background:transparent;color:var(--txt)}
.patient-action.submit{border:0;background:var(--blue);color:#fff}
.patient-action:disabled{opacity:.65;cursor:not-allowed}
@media(max-width:900px){.patient-form-layout{grid-template-columns:1fr}.patient-photo-box{flex-direction:row;align-items:center}.patient-photo-preview{width:100px;height:115px}.patient-photo-actions{width:auto}.patient-fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.patient-form-head{flex-direction:column}.patient-fields{grid-template-columns:1fr}.patient-field.span-2{grid-column:auto}.patient-photo-box{flex-direction:column}.patient-actions{flex-direction:column}.patient-action{width:100%}}
</style>

<section class="patient-form-page" id="patientFormPage" data-mode="edit">
  <div class="patient-form-shell">
    <header class="patient-form-head">
      <div>
        <h2>Editar paciente</h2>
        <p>Actualiza la información del expediente.</p>
      </div>
      <button type="button" class="patient-back" data-patient-back>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Volver a pacientes
      </button>
    </header>

    <div class="patient-form-error" id="patientFormError"></div>

    <form id="patientForm" class="patient-form-card" enctype="multipart/form-data" novalidate>
      <div class="patient-form-layout">
        <aside class="patient-photo-box">
          <div class="patient-photo-preview">
            <img id="patientPhotoPreview" alt="Foto del paciente" hidden>
            <svg id="patientPhotoPlaceholder" width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="patient-photo-actions">
            <button type="button" class="patient-photo-btn" id="patientChoosePhoto">Elegir fotografía</button>
            <button type="button" class="patient-photo-btn" id="patientRemovePhoto">Quitar fotografía</button>
          </div>
          <input type="file" name="foto" id="patientPhotoInput" accept="image/jpeg,image/png,image/webp" hidden>
        </aside>

        <div class="patient-fields">
          <div class="patient-field">
            <label for="patientFolio">Folio</label>
            <input type="text" name="folio" id="patientFolio" readonly required>
          </div>
          <div class="patient-field span-2">
            <label for="patientName">Nombre completo *</label>
            <input type="text" name="nombre_completo" id="patientName" maxlength="255" required>
          </div>
          <div class="patient-field">
            <label for="patientDob">Fecha de nacimiento</label>
            <input type="date" name="fecha_nacimiento" id="patientDob">
          </div>
          <div class="patient-field">
            <label for="patientAge">Edad</label>
            <input type="number" name="edad" id="patientAge" min="0" max="150" readonly>
          </div>
          <div class="patient-field">
            <label for="patientSex">Sexo</label>
            <select name="sexo" id="patientSex">
              <option value="">Seleccionar</option>
              <option value="Masculino">Masculino</option>
              <option value="Femenino">Femenino</option>
              <option value="Otro">Otro</option>
              <option value="No especificado">Prefiero no decir</option>
            </select>
          </div>
          <div class="patient-field">
            <label for="patientWeight">Peso (kg)</label>
            <input type="number" name="peso" id="patientWeight" min="0" max="999.99" step="0.01">
          </div>
          <div class="patient-field">
            <label for="patientHeight">Altura (m)</label>
            <input type="number" name="altura" id="patientHeight" min="0" max="9.99" step="0.01">
          </div>
          <div class="patient-field">
            <label for="patientPhone">Teléfono</label>
            <input type="tel" name="telefono" id="patientPhone" maxlength="50">
          </div>
          <div class="patient-field">
            <label for="patientEmail">Correo electrónico</label>
            <input type="email" name="email" id="patientEmail" maxlength="255">
          </div>
          <div class="patient-field span-2">
            <label for="patientAddress">Dirección</label>
            <input type="text" name="direccion" id="patientAddress" maxlength="255">
          </div>

          <section class="patient-section">
            <h3>Información médica</h3>
            <div class="patient-fields">
              <div class="patient-field"><label for="patientDoctor">Médico</label><input type="text" name="medico" id="patientDoctor" maxlength="255"></div>
              <div class="patient-field"><label for="patientProcedure">Procedimiento</label><input type="text" name="procedimiento" id="patientProcedure" maxlength="255"></div>
              <div class="patient-field"><label for="patientAnesthesiologist">Anestesiólogo</label><input type="text" name="anestesiologo" id="patientAnesthesiologist" maxlength="255"></div>
              <div class="patient-field"><label for="patientReferred">Referido por</label><input type="text" name="referido_por" id="patientReferred" maxlength="255"></div>
              <div class="patient-field span-2"><label for="patientEquipment">Equipo utilizado</label><input type="text" name="equipo_utilizado" id="patientEquipment" maxlength="255"></div>
              <div class="patient-field full"><label for="patientDiagnosis">Diagnóstico preliminar</label><textarea name="diagnostico_preliminar" id="patientDiagnosis"></textarea></div>
              <div class="patient-field span-2"><label for="patientDisease">Enfermedades o antecedentes</label><textarea name="enfermedad" id="patientDisease"></textarea></div>
              <div class="patient-field"><label for="patientAllergies">Alergias</label><textarea name="alergias" id="patientAllergies"></textarea></div>
            </div>
          </section>

          <section class="patient-section">
            <h3>Documentos del paciente</h3>
            <div class="patient-files">
              <input type="file" name="estudios_archivos[]" id="patientDocuments" multiple>
              <div class="patient-existing-files" id="patientExistingFiles"></div>
            </div>
          </section>
        </div>
      </div>

      <div class="patient-actions">
        <button type="button" class="patient-action cancel" data-patient-back>Cancelar</button>
        <button type="submit" class="patient-action submit" id="patientSubmit">Guardar cambios</button>
      </div>
    </form>
  </div>
</section>
