<div class="agenda-header rise d2">
  <div class="agenda-header-left">
    <h2>Agenda</h2>
    <p>Gestiona tus citas y procedimientos</p>
  </div>
  <button class="btn-primary" data-nav="nuevo-estudio">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Agendar cita
  </button>
</div>

<div class="agenda-body rise d3">
  <div class="agenda-left">
    <!-- Toolbar: navegación mes -->
    <div class="cal-toolbar">
      <div class="view-tabs">
        <button class="view-tab active">Mes</button>
        <button class="view-tab" disabled title="Próximamente">Semana</button>
        <button class="view-tab" disabled title="Próximamente">Día</button>
      </div>
      <div class="toolbar-right">
        <div class="month-nav">
          <button id="prevMonth" aria-label="Mes anterior">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="month-label">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span id="mesActual">Mes</span>
            <span id="anioActual">2024</span>
          </div>
          <button id="nextMonth" aria-label="Mes siguiente">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Vista Mes -->
    <div class="cal-wrap active" id="calWrap">
      <table class="cal-grid">
        <thead>
          <tr><th>Lun</th><th>Mar</th><th>Mié</th><th>Jue</th><th>Vie</th><th>Sáb</th><th>Dom</th></tr>
        </thead>
        <tbody id="calBody"></tbody>
      </table>
    </div>
  </div>

  <div class="agenda-right">
    <!-- Filtros -->
    <section class="filter-card">
      <h4>Filtrar citas</h4>
      <div class="filter-list">
        <label class="filter-row">
          <input type="checkbox" checked data-filter="ev-done">
          <span class="filter-indicator done"></span>
          <span class="filter-text">Completado</span>
        </label>
        <label class="filter-row">
          <input type="checkbox" checked data-filter="ev-wait">
          <span class="filter-indicator wait"></span>
          <span class="filter-text">En espera</span>
        </label>
        <label class="filter-row">
          <input type="checkbox" checked data-filter="ev-cancel">
          <span class="filter-indicator cancel"></span>
          <span class="filter-text">Cancelado</span>
        </label>
        <label class="filter-row">
          <input type="checkbox" checked data-filter="ev-soon">
          <span class="filter-indicator soon"></span>
          <span class="filter-text">Próxima</span>
        </label>
      </div>
    </section>

    <!-- Próximas citas -->
    <section class="proximas-card">
      <h4>Próximas citas</h4>
      <div class="prox-list" id="proxList">
        <div style="text-align:center;padding:20px;color:var(--txt-soft);font-size:12px">No hay citas próximas agendadas</div>
      </div>
    </section>
  </div>
</div>
