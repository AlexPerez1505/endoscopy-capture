
  </style>

  <section id="patientFormPage">

  <a
    href="#pacientes"
    class="back-link rise d1"
    data-patient-back
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>

    Volver a pacientes
  </a>

  <form
    id="pacienteForm"
    class="form-card rise d2"
    enctype="multipart/form-data"
    novalidate
  >
    <div class="patient-form-heading">
      <h2 class="section-title">
        Informacion personal
      </h2>

      <div class="patient-folio-chip">
        <span>Folio:</span>

        <strong id="patientFolioText">
          â€”
        </strong>

        <input
          type="hidden"
          name="folio"
          id="folioInput"
        >

        <input
          type="hidden"
          name="identificacion"
          id="identificacionInput"
        >
      </div>
    </div>

    <div class="personal-layout">
      <div id="photoColPlaceholder"></div>

      <div class="form-grid personal">
        <div class="form-group span-2">
          <label for="patientName">
            Nombre completo
          </label>

          <input
            type="text"
            name="nombre_completo"
            id="patientName"
            placeholder="Nombre completo del paciente"
            maxlength="255"
            required
          >
        </div>

        <div class="form-group">
          <label for="fechaNacimiento">
            Fecha de nacimiento
          </label>

          <input
            type="date"
            name="fecha_nacimiento"
            id="fechaNacimiento"
          >
        </div>

        <div class="form-group">
          <label for="edadCalculada">
            Edad
          </label>

          <input
            type="number"
            name="edad"
            id="edadCalculada"
            readonly
            placeholder="00"
          >
        </div>

        <div class="form-group">
          <label for="patientWeight">
            Peso
          </label>

          <input
            type="number"
            step="0.01"
            min="0"
            max="999.99"
            name="peso"
            id="patientWeight"
            placeholder="Peso en kg"
          >
        </div>

        <div class="form-group">
          <label for="patientHeight">
            Altura
          </label>

          <input
            type="number"
            step="0.01"
            min="0"
            max="9.99"
            name="altura"
            id="patientHeight"
            placeholder="Altura en metros"
          >
        </div>

        <div class="form-group">
          <label for="patientSex">
            Sexo
          </label>

          <select
            name="sexo"
            id="patientSex"
          >
            <option value="">
              Selecciona sexo
            </option>
            <option value="femenino">
              Femenino
            </option>
            <option value="masculino">
              Masculino
            </option>
            <option value="otro">
              Otro
            </option>
          </select>
        </div>

        <div class="form-group span-2">
          <label for="patientAddress">
            Direccion
          </label>

          <input
            type="text"
            name="direccion"
            id="patientAddress"
            placeholder="Calle, colonia y cÃ³digo postal"
            maxlength="255"
          >
        </div>

        <div class="form-group">
          <label for="patientPhone">
            Telefono
          </label>

          <input
            type="tel"
            name="telefono"
            id="patientPhone"
            placeholder="722 162 0815"
            maxlength="50"
          >
        </div>

        <div class="form-group span-3">
          <label for="patientEmail">
            E-mail
          </label>

          <input
            type="email"
            name="email"
            id="patientEmail"
            placeholder="correo@ejemplo.com"
            maxlength="255"
          >
        </div>
      </div>
    </div>

  <div id="medicalFormPlaceholder"></div>

  <div
    class="mini-modal-overlay"
    id="patientMiniModal"
    aria-hidden="true"
  >
    <div class="mini-modal">
      <h3 id="patientMiniTitle">
        Agregar
      </h3>

      <p id="patientMiniDescription">
        Escribe el valor
      </p>

      <input
        type="text"
        id="patientMiniInput"
        placeholder="Nombre..."
        autocomplete="off"
      >

      <div class="mini-modal-footer">
        <button
          type="button"
          class="mini-modal-cancel"
          id="patientMiniCancel"
        >
          Cancelar
        </button>

        <button
          type="button"
          class="mini-modal-confirm"
          id="patientMiniConfirm"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>

  <div id="photoModalPlaceholder"></div>

  <div
    class="file-viewer-overlay"
    id="patientFileViewer"
    aria-hidden="true"
  >
    <div class="file-viewer">
      <div class="file-viewer-head">
        <span
          class="file-viewer-title"
          id="patientFileViewerTitle"
        >
          Archivo
        </span>

        <button
          type="button"
          class="btn-cancel"
          id="patientFileViewerClose"
        >
          Cerrar
        </button>
      </div>

      <div
        class="file-viewer-content"
        id="patientFileViewerContent"
      ></div>
    </div>
  </div>

  <div
    class="success-modal-overlay"
    id="patientSuccessModal"
    aria-hidden="true"
  >
    <div class="success-modal">
      <div class="success-modal-icon">
        <svg
          width="34"
          height="34"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
        >
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <h2 id="patientSuccessTitle">
        ¡Paciente registrado!
      </h2>

      <p id="patientSuccessMessage">
        El paciente ha sido guardado correctamente.
      </p>

      <button
        type="button"
        class="btn-save"
        id="patientSuccessAccept"
      >
        Volver a pacientes
      </button>
    </div>
  </div>
</section>
