<section class="messages-page">
  <div class="messages-toolbar rise d2" aria-label="Acciones de mensajes">
    <button class="messages-channel-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
      </svg>
      <span>Canales de comunicacion</span>
      <svg class="messages-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>

  </div>

  <div class="messages-shell rise d3">
    <aside class="messages-sidebar" aria-label="Conversaciones">
      <div class="messages-search-row">
        <label class="messages-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input id="messagesSearchInput" type="search" placeholder="Buscar conversaciones..." autocomplete="off">
        </label>
        <button class="messages-filter-btn" type="button" aria-label="Filtrar conversaciones">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 3H2l8 9.46V19l4 2v-8.54z"></path>
          </svg>
        </button>
      </div>

      <nav class="messages-tabs" aria-label="Filtros">
        <button class="is-active" type="button" data-message-tab="all">Todas</button>
        <button type="button" data-message-tab="unread">No leidos</button>
        <button type="button" data-message-tab="favorites">Favoritos</button>
        <button type="button" data-message-tab="archived">Archivados</button>
      </nav>

      <div class="messages-conversation-list" id="messagesConversationList"></div>

      <button class="messages-load-more" type="button">
        <span>Cargar mas</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </aside>

    <section class="messages-chat" aria-label="Chat del paciente">
      <header class="messages-chat-head">
        <div class="messages-chat-patient">
          <span class="messages-avatar avatar-blue" id="messagesActiveAvatar">KM</span>
          <div>
            <h2 id="messagesActiveName">Kevin Martinez</h2>
            <p><span class="messages-online-dot"></span>En linea</p>
          </div>
        </div>
        <div class="messages-chat-actions">
          <button type="button" aria-label="Buscar en chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
          </button>
          <button type="button" aria-label="Llamar paciente">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 3.08 5.18 2 2 0 0 1 5.06 3h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L9 10.69a16 16 0 0 0 4.31 4.31l1.23-1.23a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </button>
          <button type="button" aria-label="Mas opciones">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="1"></circle>
              <circle cx="12" cy="5" r="1"></circle>
              <circle cx="12" cy="19" r="1"></circle>
            </svg>
          </button>
        </div>
      </header>

      <div class="messages-chat-body" id="messagesChatBody">
        <p class="messages-empty-state">Todavia no hay mensajes con este paciente.</p>
      </div>

      <form class="messages-composer" id="messagesComposer">
        <div class="messages-composer-box">
          <button type="button" aria-label="Insertar reaccion">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
              <path d="M9 9h.01"></path>
              <path d="M15 9h.01"></path>
            </svg>
          </button>
          <button type="button" aria-label="Adjuntar archivo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>
          <button type="button" aria-label="Mensaje de voz">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <path d="M12 19v4"></path>
              <path d="M8 23h8"></path>
            </svg>
          </button>
          <input id="messagesComposerInput" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
        </div>
        <button class="messages-send-btn" type="submit" aria-label="Enviar mensaje">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m22 2-7 20-4-9-9-4Z"></path>
            <path d="M22 2 11 13"></path>
          </svg>
        </button>
      </form>
    </section>
  </div>
</section>
